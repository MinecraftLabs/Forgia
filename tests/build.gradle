plugins {
    id 'java'
    id 'net.neoforged.licenser'
    id 'neoforge.formatting-conventions'
}

apply plugin : net.neoforged.neodev.NeoDevExtraPlugin

evaluationDependsOn(":neoforge")

def neoforgeProject = project(':neoforge')
def testframeworkProject = project(':testframework')
def coremodsProject = project(':neoforge-coremods')

sourceSets {
    main {
        resources {
            srcDir file('src/generated/resources')
        }
    }
    junit {}
}

dependencies {
    implementation(neoforgeProject)
    implementation(testframeworkProject)

    junitImplementation(platform("org.junit:junit-bom:${project.jupiter_api_version}"))
    junitImplementation "org.junit.jupiter:junit-jupiter-params"
    junitRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"

    junitImplementation("org.assertj:assertj-core:${project.assertj_core}")
    junitImplementation("org.mockito:mockito-core:${project.mockito_core}")
    junitImplementation "net.neoforged.fancymodloader:junit-fml:${project.fancy_mod_loader_version}"
    junitImplementation(neoforgeProject)
    junitImplementation(testframeworkProject)

    compileOnly "org.jetbrains:annotations:${project.jetbrains_annotations_version}"
}

// Select runtimeElements rather than universalJar from the neoforge project
sourceSets.each {
    configurations.named(it.runtimeClasspathConfigurationName) {
        attributes {
            attribute(Attribute.of("net.neoforged.neoforge.includes-minecraft", Boolean), true)
        }
    }
}

junitTest {
    useJUnitPlatform {
        // The timing harness reports numbers instead of asserting behavior; it is run on demand through
        // :tests:junitBenchmark so a machine-dependent measurement can never fail the normal test run.
        excludeTags "benchmark"
    }
    classpath = sourceSets.junit.output + sourceSets.junit.runtimeClasspath
    testClassesDirs = sourceSets.junit.output.classesDirs
    outputs.upToDateWhen { false }
}

// Dedicated timing harness task. It runs only the classes tagged "benchmark" and prints their tables to
// the console; no assertion on the reported timings exists, so it cannot fail the build on a slow machine.
tasks.register("junitBenchmark", Test) { benchmark ->
    group = "verification"
    description = "Runs the region engine benchmark harness (JUnit tag 'benchmark')."
    useJUnitPlatform {
        includeTags "benchmark"
    }
    classpath = sourceSets.junit.output + sourceSets.junit.runtimeClasspath
    testClassesDirs = sourceSets.junit.output.classesDirs
    outputs.upToDateWhen { false }
    // The block-entity workload builds real chunks, furnaces and their tickers per configuration, so the
    // benchmark needs more headroom than the 512m Gradle default of junitTest.
    maxHeapSize = "2g"
    testLogging {
        showStandardStreams = true
        events "passed", "failed", "skipped"
    }
}

// The benchmark needs the same NeoDev test harness (module path, mod loading, Minecraft test setup) as
// junitTest, which NeoDevExtraPlugin configures on that task.
def junitTestTask = tasks.named("junitTest", Test)
tasks.named("junitBenchmark", Test).configure { benchmark ->
    def source = junitTestTask.get()
    benchmark.jvmArgumentProviders.addAll(source.jvmArgumentProviders)
    benchmark.systemProperties.putAll(source.systemProperties)
    benchmark.jvmArgs(source.jvmArgs)
    benchmark.environment.putAll(source.environment)
    benchmark.executable = source.executable
    benchmark.workingDir = source.workingDir
    benchmark.dependsOn source.dependsOn
}

neoDev {
    mods {
        neotests {
            sourceSet sourceSets.main
        }
        testframework {
            sourceSet project(":testframework").sourceSets.main
        }
        junit {
            sourceSet sourceSets.junit
        }
        coremods {
            sourceSet coremodsProject.sourceSets.main
        }
    }

runs {
        configureEach {
            gameDirectory = layout.projectDir.dir("run/$name")
            systemProperty("terminal.ansi", "true")
        }
    client {
            client()
    }
    server {
            server()
    }
    gameTestServer {
            type = "gameTestServer"
            // The server load measurement GameTest is registered in every GameTest run, but it only runs
            // its workload when this property is set. A normal run therefore does not force-load a 16x16
            // chunk grid with thousands of furnaces; the measurement passes -PserverBenchmark=true.
            systemProperty("neoforge.serverBenchmark", providers.gradleProperty("serverBenchmark").getOrElse("false"))
            // Measurement runs pass -PserverBenchmarkFurnaces=N to vary the size of the furnace workload
            // without editing the test; unset keeps the default workload of the test.
            systemProperty("neoforge.serverBenchmarkFurnaces", providers.gradleProperty("serverBenchmarkFurnaces").getOrElse("4096"))
            // Measurement runs pass -PserverBenchmarkHoppers=N to vary the size of the hopper workload
            // without editing the test; unset keeps the default workload of the test.
            systemProperty("neoforge.serverBenchmarkHoppers", providers.gradleProperty("serverBenchmarkHoppers").getOrElse("2048"))
            // Measurement runs pass -PserverBenchmarkPistons=N to vary the size of the piston workload without
            // editing the test; unset keeps the default workload of the test.
            systemProperty("neoforge.serverBenchmarkPistons", providers.gradleProperty("serverBenchmarkPistons").getOrElse("128"))
            // Measurement runs pass -PserverBenchmarkPistonClockTicks=N to vary the period of the piston clock;
            // unset keeps the twenty-tick clock of the default workload.
            systemProperty("neoforge.serverBenchmarkPistonClockTicks", providers.gradleProperty("serverBenchmarkPistonClockTicks").getOrElse("20"))
            // Measurement runs pass -PserverBenchmarkPistonSize=N to pin every piston column to one size class;
            // unset mixes the sizes 1..12.
            systemProperty("neoforge.serverBenchmarkPistonSize", providers.gradleProperty("serverBenchmarkPistonSize").getOrElse("0"))
            // Measurement runs pass -PserverBenchmarkPistonBorderRowPeriod=0 to keep every piston of the
            // workload inside its own region; unset keeps the half-crossing default workload.
            systemProperty("neoforge.serverBenchmarkPistonBorderRowPeriod", providers.gradleProperty("serverBenchmarkPistonBorderRowPeriod").getOrElse("2"))
            // Measurement runs pass -PserverBenchmarkBlockEntityAdmissionCache=false to measure the hopper
            // workload with the per-chunk block-entity admission cache turned off; unset keeps the cache on.
            systemProperty("neoforge.serverBenchmarkBlockEntityAdmissionCache", providers.gradleProperty("serverBenchmarkBlockEntityAdmissionCache").getOrElse("true"))
            // Measurement runs pass -PserverBenchmarkEntityWorkerTicks=false to measure the same entity
            // worker workload with its entity ticks on the server thread, which is the reference row.
            systemProperty("neoforge.serverBenchmarkEntityWorkerTicks", providers.gradleProperty("serverBenchmarkEntityWorkerTicks").getOrElse("true"))
            // Measurement runs pass -PserverBenchmarkZombies=N to vary the population of the entity worker
            // workload without editing the test; unset keeps the default population of the test.
            systemProperty("neoforge.serverBenchmarkZombies", providers.gradleProperty("serverBenchmarkZombies").getOrElse("64"))
            // Measurement runs pass -PserverBenchmarkMob=minecraft:cow to measure the same entity worker
            // workload with a mob the per-type entity policy keeps on a region worker, next to the zombie row
            // that measures what the policy costs. Unset keeps the zombie.
            systemProperty("neoforge.serverBenchmarkMob", providers.gradleProperty("serverBenchmarkMob").getOrElse(""))
            // Measurement runs pass -PserverBenchmarkVillagers=N to run the entity worker workload with
            // villagers that own a bed and a workstation, so the POI path the policy pins really runs.
            systemProperty("neoforge.serverBenchmarkVillagers", providers.gradleProperty("serverBenchmarkVillagers").getOrElse(""))
            // Measurement runs pass -PserverBenchmarkZombieDeaths=N to drive N zombie deaths every 10 ticks
            // of the entity worker workload; unset keeps the population alive for the whole window.
            systemProperty("neoforge.serverBenchmarkZombieDeaths", providers.gradleProperty("serverBenchmarkZombieDeaths").getOrElse("0"))
            // Measurement runs pass -PserverBenchmarkZombieLoot=false to turn the mob loot rule off for the
            // entity worker window; unset keeps the vanilla rule.
            systemProperty("neoforge.serverBenchmarkZombieLoot", providers.gradleProperty("serverBenchmarkZombieLoot").getOrElse("true"))
            // Measurement runs pass -PserverBenchmarkSpawnChunks=N to size the natural spawning workload grid
            systemProperty("neoforge.serverBenchmarkSpawnChunks", providers.gradleProperty("serverBenchmarkSpawnChunks").getOrElse("289"))
            // Measurement runs pass -PserverBenchmarkRandomTickChunks=N to size the random tick workload grid
            // without editing the test; unset keeps the default workload of the test.
            systemProperty("neoforge.serverBenchmarkRandomTickChunks", providers.gradleProperty("serverBenchmarkRandomTickChunks").getOrElse("256"))
            // Measurement runs pass -PserverBenchmarkTicks=N to lengthen the measured window of the entity
            // worker soak; unset keeps the default window of the soak.
            systemProperty("neoforge.serverBenchmarkTicks", providers.gradleProperty("serverBenchmarkTicks").getOrElse("3000"))
            // Measurement runs pass -PgameTestFilter=benchmarkFurnace,benchmarkEntity so only the
            // benchmark batches run instead of the whole GameTest suite. Unset keeps every test.
            systemProperty("neoforge.gameTestServer.filter", providers.gradleProperty("gameTestFilter").getOrElse(""))
    }
    // The production soak: the same generated world and the same window twice, once with the whole region
    // threading combination enabled and once with region threading off. The two runs are the milestone's
    // production measurement; the reference run also compares its redstone state series with the series the
    // threading-on run wrote. Both runs start from a fresh world directory, because the GameTest server saves
    // its world on shutdown and the fixed seed only reproduces the same terrain for a world that is generated
    // again. The region threading switches are written into the run's server config before the server starts,
    // so the engine is installed from the configuration the production server reads, not from a test seam.
    soakGameTestServer {
            type = "gameTestServer"
            systemProperty("neoforge.serverSoak", "true")
            systemProperty("neoforge.gameTestServer.filter", "productionSoak")
            systemProperty("neoforge.gameTestWorldPreset", providers.gradleProperty("soakWorldPreset").getOrElse("minecraft:normal"))
            systemProperty("neoforge.gameTestWorldSeed", providers.gradleProperty("soakWorldSeed").getOrElse("4242424242"))
            systemProperty("neoforge.soakTicks", providers.gradleProperty("soakTicks").getOrElse("6000"))
            systemProperty("neoforge.soakRegionThreading", "true")
            systemProperty("neoforge.soakReference", "")
            systemProperty("neoforge.soakReport", "soak-report")
    }
    soakGameTestServerReference {
            type = "gameTestServer"
            systemProperty("neoforge.serverSoak", "true")
            systemProperty("neoforge.gameTestServer.filter", "productionSoak")
            systemProperty("neoforge.gameTestWorldPreset", providers.gradleProperty("soakWorldPreset").getOrElse("minecraft:normal"))
            systemProperty("neoforge.gameTestWorldSeed", providers.gradleProperty("soakWorldSeed").getOrElse("4242424242"))
            systemProperty("neoforge.soakTicks", providers.gradleProperty("soakTicks").getOrElse("6000"))
            systemProperty("neoforge.soakRegionThreading", "false")
            systemProperty("neoforge.soakReference", project.file("runs/soakGameTestServer/soak-report/redstone-on.csv").absolutePath)
            systemProperty("neoforge.soakReport", "soak-report")
    }
    data {
            data()

            programArguments.addAll '--flat', '--all', '--validate',
                '--mod', 'data_gen_test',
                '--mod', 'global_loot_test',
                '--mod', 'scaffolding_test',
                '--mod', 'custom_tag_types_test',
                '--mod', 'new_model_loader_test',
                '--mod', 'remove_tag_datagen_test',
                '--mod', 'tag_based_tool_types',
                '--mod', 'custom_transformtype_test',
                '--mod', 'data_pack_registries_test',
                '--mod', 'biome_modifiers_test',
                '--mod', 'structure_modifiers_test',
                '--mod', 'custom_preset_editor_test',
                '--mod', 'custom_predicate_test',
                '--mod', 'neotests',
                '--existing-mod', 'testframework',
                    '--existing', project.file("src/main/resources").absolutePath,
                    '--output', project.file("src/generated/resources").absolutePath
    }
}

runs.configureEach {
        // Add NeoForge and Minecraft (both under the "minecraft" mod), and exclude junit.
        loadedMods = [neoforgeProject.neoDev.mods.minecraft, mods.neotests, mods.testframework, mods.coremods]

        gameDirectory.set project.file("runs/${it.name}") as File
    }
}

neoDevTest {
    loadedMods = [ project(":neoforge").neoDev.mods.minecraft, neoDev.mods.testframework, neoDev.mods.coremods, neoDev.mods.junit ]
}

// Region threading switches of the production soak. The threading-on run enables the whole combination the
// milestone reports on; the reference run disables the bridge, which is what "region threading off" means.
// The file is a partial server config: every key the run does not name keeps the default of NeoForgeConfig, so
// the soak cannot silently drift from the shipped defaults of the other switches.
def soakConfigText(boolean regionThreading) {
    return """# Written by the production soak run of tests/build.gradle before the server starts.
# Only the region threading switches are named; every other key keeps its NeoForgeConfig default.
enableRegionThreadingBridge = ${regionThreading}
enableRegionThreadingWorkers = ${regionThreading}
enableGlobalRegionThreadingWorker = ${regionThreading}
enableRegionThreadingEntityTicks = ${regionThreading}
enableRegionThreadingBlockEntityTicks = ${regionThreading}
enableRegionThreadingScheduledTicks = ${regionThreading}
enableRegionThreadingRandomTicks = ${regionThreading}
enableRegionThreadingSpawning = ${regionThreading}
enableRegionThreadingPoi = ${regionThreading}
enableRegionThreadingBorderUpdates = ${regionThreading}
enableRegionThreadingPersistentWorkers = ${regionThreading}
enableRegionThreadingPackedRegionLeases = ${regionThreading}
regionThreadingWorkerThreads = ${regionThreading ? 4 : 0}
regionThreadingMode = "FIXED_3X3"
regionThreadingFixedRegionChunks = 3
regionThreadingOwnershipViolationMode = "WARN"
"""
}

[
    soakGameTestServer       : [regionThreading: true],
    soakGameTestServerReference: [regionThreading: false]
].each { String runName, Map options ->
    def prepare = tasks.register("prepare${runName.capitalize()}") {
        group = "runs"
        description = "Starts the ${runName} soak from a fresh world and writes its region threading config."
        def worldDirectory = layout.projectDirectory.dir("runs/${runName}/world").asFile
        def configFile = layout.projectDirectory.file("runs/${runName}/config/neoforge-server.toml").asFile
        def configText = soakConfigText(options.regionThreading)
        doLast {
            worldDirectory.deleteDir()
            configFile.parentFile.mkdirs()
            configFile.text = configText
        }
    }
    tasks.named("run${runName.capitalize()}").configure { dependsOn prepare }
}

license {
    header = rootProject.file('codeformat/HEADER.txt')
    skipExistingHeaders = true
    include '**/*.java'
}
